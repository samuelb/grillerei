name: Platzdaten aktualisieren

on:
  schedule:
    - cron: '17 3 * * 1'      # montags 03:17 UTC
  workflow_dispatch:
    inputs:
      bbox:
        description: 'Bereich als "süd,west,nord,ost" (leer = DACH)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Overpass wird blockweise abgefragt, mit Pausen und Wiederholungen.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Kacheln bauen
        env:
          GRILLEREI_BBOX: ${{ inputs.bbox }}
        run: node tools/build-data.js

      - name: Änderungen committen
        run: |
          if git diff --quiet -- data; then
            echo "Keine Änderungen an den Platzdaten."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Platzdaten aktualisiert ($(date -u +%Y-%m-%d))"
          git push
